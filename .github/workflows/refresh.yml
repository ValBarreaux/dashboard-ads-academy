name: Refresh dashboard ads

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install gspread google-auth

      - name: Recuperer les donnees Meta
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python fetch_meta.py

      - name: Recuperer les ventes (ROAS)
        continue-on-error: true
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: python fetch_sales.py

      - name: Construire le dashboard
        run: |
          python analyze.py
          python build_dashboard3.py
          mkdir -p _site
          cp dashboard_ads.html _site/index.html

      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Uploader le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deployer sur GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
